name: Deploy to Hostatom
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm install
          npm install -D lightningcss-linux-x64-gnu

      - name: Build Static HTML
        run: npm run build

      # ---- Deploy ด้วย lftp (FTPS + passive + retry) — ทนกว่า FTP-Deploy-Action มาก ----
      # แก้อาการ ECONNRESET (data socket) ที่ plain FTP โดน Hostatom ตัดกลางคัน
      - name: Deploy via lftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y lftp
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            set net:max-retries 5;
            set net:persist-retries 5;
            set net:timeout 30;
            set net:reconnect-interval-base 5;
            set xfer:clobber on;
            open -u '$FTP_USERNAME','$FTP_PASSWORD' '$FTP_SERVER';
            mirror -R --parallel=1 --verbose ./dist/ ./aiotsmartdata.webdemona.com/;
          "
